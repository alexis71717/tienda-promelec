# =====================================================================
# docker-compose para correr la API junto a SQL Server localmente.
# Uso:
#   1) Crea un archivo .env con las variables de abajo
#   2) docker-compose up -d --build
# =====================================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: promelec-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - promelec-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -No -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promelec-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PromElec;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "TiendaPromElec"
      Jwt__Audience: "TiendaPromElecClients"
      Jwt__ExpiresMinutes: "60"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD}"
      Cors__AllowedOrigins__0: "${ALLOWED_ORIGIN_1:-https://localhost:5173}"
    ports:
      - "8080:8080"
    networks:
      - promelec-net
    restart: unless-stopped

networks:
  promelec-net:
    driver: bridge

volumes:
  sqlserver_data:
